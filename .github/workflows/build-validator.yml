name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: /opt/vcpkg
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            build_dir: build_debug
            run_test: true
          - preset: release
            build_dir: build
            run_test: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            curl zip unzip tar git ca-certificates

      - name: Cache vcpkg binary packages
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Install vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: |
          VCPKG_BINARY_SOURCES="clear;files,$HOME/.cache/vcpkg,readwrite" \
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --preset ${{ matrix.preset }}

      - name: Test
        if: ${{ matrix.run_test }}
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure
